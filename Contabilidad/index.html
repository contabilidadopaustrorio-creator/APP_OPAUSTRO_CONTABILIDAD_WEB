<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B3C49">
  <title>Contabilidad — OPAUSTRO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{ --navy:#0B3C49; --teal:#1A7A8A; --gray1:#F4F7F9; --text:#1C2E35; --muted:#9AADB5; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray1);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(11,60,73,.12);max-width:520px;width:100%;padding:32px;text-align:center;border-top:4px solid var(--teal)}
    .icon{font-size:44px;margin-bottom:10px}
    h1{color:var(--navy);font-size:1.4rem;margin-bottom:8px}
    p{color:#5a6b73;font-size:.95rem;line-height:1.5}
    .tag{display:inline-block;margin-top:16px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:#E3F5F8;border-radius:20px;padding:6px 14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📊</div>
    <h1>Módulo Contabilidad</h1>
    <p>Este es el módulo de contabilidad. Aquí se construirá la funcionalidad (reportes, registros, etc.).</p>
    <span class="tag">En construcción</span>
  </div>
  <script src="../session-activity.js"></script>
</body>
</html>
